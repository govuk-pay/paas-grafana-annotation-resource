name: Post Merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  tag-release:
    needs:
      - tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@bc6ed6b7584f8ffa2049f546d0d4534cbb5cc5e0
