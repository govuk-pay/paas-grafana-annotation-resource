name: Post Merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  tag-release:
    needs:
      - tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@9156d63813619962df7527e767e04a46c48219d0
